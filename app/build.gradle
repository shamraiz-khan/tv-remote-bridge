plugins {
    id 'com.android.application'
}

android {
    namespace 'com.example.tvremotebridge'
    compileSdk 34

    defaultConfig {
        applicationId "com.example.tvremotebridge"
        minSdk 26
        targetSdk 34
        versionCode 1
        versionName "1.0"
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'org.nanohttpd:nanohttpd:2.3.1'
}